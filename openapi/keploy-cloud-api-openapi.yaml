            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAPIKeyCreated"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
        "500": { $ref: "#/components/responses/InternalError" }
    get:
      operationId: listAPIKeys
      x-required-scope: admin
      summary: List API keys
      description: "Requires scope: `admin`."
      tags: [API Keys]
      responses:
        "200":
          description: API key list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeAPIKeyList"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /api-keys/{keyId}:
    parameters:
      - name: keyId
        in: path
        required: true
        schema: { type: string }
    delete:
      operationId: revokeAPIKey
      x-required-scope: admin
      summary: Revoke an API key
      description: "Requires scope: `admin`."
      tags: [API Keys]
      responses:
        "200":
          description: API key revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvelopeDeleted"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /apps/{appId}/smart-set/cases:
    parameters:
      - $ref: "#/components/parameters/appId"
    get:
      operationId: listSmartTestCases
      summary: List smart test cases
      description: |
        Returns the app's smart test set — the deduped, content-addressed set of
        API contracts maintained across recording sessions. Pass `branch_id` to
        get a branch's curated view (main cases ⊕ that branch's edits); absent →
        the main view. `include_obsolete=true` includes cases a user marked
        skip-in-replay. Requires scope: `read`.
      x-required-scope: read
      tags: [SmartSet]
      parameters:
        - $ref: "#/components/parameters/branchId"
        - name: include_obsolete
          in: query
          schema: { type: boolean, default: false }
          description: Include cases marked obsolete (skip-in-replay).
      responses:
        "200":
          description: Smart test cases
          content:
            application/json:
              schema: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /apps/{appId}/smart-set/cases/{name}:
    parameters:
      - $ref: "#/components/parameters/appId"
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Smart-set-local case name (e.g. "test-3").
    patch:
      operationId: updateSmartTestCase
      summary: Edit a smart test case (branch-only)
      description: |
        Edit a smart case on a branch. `branch_id` is REQUIRED — recording-driven
        main is never hand-edited; edits live on a branch, are reviewed via the
        branch diff, then merged. Value edits (noise/assertions/golden response
        body/description/mock links) write in place; SHAPE edits (endpoint/method/
        status via request/response) recompute the contract identity (schema_ref)
        and, on collision with another case, return a conflict in the body rather
        than silently merging. Patch fields are JSON strings so the wire stays
        unambiguous; only provided fields are applied. Requires scope: `write`.
      x-required-scope: write
      tags: [SmartSet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id]
              properties:
                branch_id: { type: string, description: Branch UUID — required (edits are branch-only). }
                noiseJson: { type: string, description: "JSON map<string,[]string> of fields to ignore on compare." }
                assertionsJson: { type: string, description: JSON assertions map. }
                description: { type: string }
                respBody: { type: string, description: Golden response body override (value edit). }
                requestJson: { type: string, description: "Full HTTPReq JSON (SHAPE edit — recomputes schema_ref)." }
                responseJson: { type: string, description: "Full HTTPResp JSON (SHAPE edit)." }
                mockReferencesJson: { type: string, description: "JSON array of {name,kind} — relink which mocks this case uses." }
      responses:
        "200":
          description: Updated case, or a schema_ref conflict
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSmartTestCase
      summary: Delete a smart test case (branch-only)
      description: |
        Delete a smart case on a branch — a tombstone overlay; main is untouched
        until merge. `branch_id` is REQUIRED: edits, including delete, are
        branch-only. Requires scope: `write`.
      x-required-scope: write
      tags: [SmartSet]
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: { type: string }
          description: Branch UUID — required (delete is branch-only).
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /apps/{appId}/smart-set/cases/{name}/obsolete:
    parameters:
      - $ref: "#/components/parameters/appId"
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Smart-set-local case name (e.g. "test-3").
    post:
      operationId: setSmartTestCaseObsolete
      summary: Mark a smart test case obsolete / restore it (branch-only)
      description: |
        Toggle a smart case's obsolete flag (skip-in-replay) on a branch — an
        overlay edit. `branch_id` is REQUIRED: edits, including obsolete, are
        branch-only. Requires scope: `write`.
      x-required-scope: write
      tags: [SmartSet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [obsolete, branch_id]
              properties:
                obsolete: { type: boolean }
                branch_id: { type: string, description: Branch UUID — required (obsolete is branch-only). }
      responses:
        "200":
          description: Updated case
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

  /apps/{appId}/smart-set/mocks/{name}:
    parameters:
      - $ref: "#/components/parameters/appId"
      - name: name
        in: path
        required: true
        schema: { type: string }
        description: Smart-set mock name (e.g. "mock-2").
    put:
      operationId: upsertSmartMock
      summary: Create or replace a smart-set mock's content (branch-only)
      description: |
        Write/replace a smart-set mock's content (a single NetworkTrafficDoc
        YAML) on a branch. `branch_id` is REQUIRED — main mocks come from
        recording and refresh via re-record; hand edits live on a branch, are
        reviewed via the branch diff, then merged. Requires scope: `write`.
      x-required-scope: write
      tags: [SmartSet]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, mockYaml]
              properties:
                branch_id: { type: string, description: Branch UUID — required (edits are branch-only). }
                mockYaml: { type: string, description: "The mock as a NetworkTrafficDoc YAML document." }
      responses:
        "200":
          description: Upserted
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }
    delete:
      operationId: deleteSmartMock
      summary: Delete a smart-set mock (branch-only)
      description: |
        Tombstone a smart-set mock on a branch. `branch_id` is REQUIRED — edits
        are branch-only. Requires scope: `write`.
      x-required-scope: write
      tags: [SmartSet]
      parameters:
        - name: branch_id
          in: query
          required: true
          schema: { type: string }
          description: Branch UUID — required (edits are branch-only).
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "500": { $ref: "#/components/responses/InternalError" }

# ─── Components ───────────────────────────────────────────────────────────
components:
  securitySchemes:
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: "Personal Access Token (`kep_`-prefixed). Generate from Settings > API Keys."

  parameters:
    appId:
      name: appId
      in: path
      required: true
      schema: { type: string }
    suiteId:
      name: suiteId
      in: path
      required: true
      schema: { type: string }
    branchId:
      name: branch_id
      in: query
      required: false
      description: |
        Optional Keploy branch UUID. When set, scopes the read/write to that branch's overlay
        (copy-on-write — see /apps/{appId}/branches). When absent or empty, operations target
        the main branch (the historical default). Required for writes against a branch (the
        api-server's branch gate rejects 400 otherwise); reads are tolerant of absence.
      schema: { type: string }
    runId:
      name: runId
      in: path
      required: true
      schema: { type: string }
    reportId:
      name: reportId
      in: path
      required: true
      schema: { type: string }
    testSetId:
      name: testSetId
      in: path
      required: true
      schema: { type: string }
    testSetReportId:
      name: testSetReportId
      in: path
      required: true
      schema: { type: string }
    clusterId:
      name: clusterId
      in: path
      required: true
      schema: { type: string }
    jobId:
      name: jobId
      in: path
      required: true
      schema: { type: string }
    offset:
      name: offset
      in: query
      description: |
        Zero-based pagination offset. Negative values are rejected — the
        handler also clamps to 0 as a defence-in-depth fallback.
      schema:
        type: integer
        default: 0
        minimum: 0
    limit:
      name: limit
      in: query
      description: |
        Page size. Defaults to 20 when omitted; `limit=0` is also treated
        as "use default" (so existing clients sending an explicit zero
        keep the prior behaviour). Capped at 100 — the spec rejects
        higher values with 400 so callers fail loudly instead of being
        silently clamped, and the handler enforces the same cap as a
        defence-in-depth fallback.
      schema:
        type: integer
        default: 20
        minimum: 0
        maximum: 100

  schemas:
    # ── Envelope / Meta ───────────────────────────────────────────────
    Envelope:
      type: object
      properties:
        data: {}
        error:
          $ref: "#/components/schemas/APIError"
        meta:
          $ref: "#/components/schemas/Meta"

    Meta:
      type: object
      properties:
        request_id: { type: string }
        trace_id: { type: string }
        timestamp: { type: string, format: date-time }
        pagination:
          $ref: "#/components/schemas/Pagination"

    Pagination:
      type: object
      properties:
        has_next_page: { type: boolean }
        has_previous_page: { type: boolean }
        next_cursor: { type: string, nullable: true }
        previous_cursor: { type: string, nullable: true }
        total_count: { type: integer, nullable: true }

    APIError:
      type: object
      properties:
        code: { type: string }
        message: { type: string }
        details:
          type: array
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorDetail:
      type: object
      properties:
        field: { type: string }
        message: { type: string }

    # ── Domain objects ────────────────────────────────────────────────
    AppResponse:
      type: object
      description: Lightweight app shape returned by listApps. Single-app reads (getApp/updateApp/createApp) return the full `App` schema below instead.
      properties:
        id: { type: string }
        name: { type: string }
        endpoint: { type: string }
        cid: { type: string }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    # Full app shape returned by getApp / updateApp / createApp. Carries
    # the runtime-config fields Claude needs to diagnose + patch a
    # failing test suite (auth misconfig, missing custom variable, etc.)
    # via the read→patch→retry loop. Loose schema (additionalProperties:
    # true) because the underlying models.App carries many ancillary
    # fields the AI typically ignores; the listed properties are the
    # canonical surface for AI inspection and updateApp patches.
    App:
      type: object
      additionalProperties: true
      properties:
        id: { type: string }
        name: { type: string }
        endpoint: { type: string }
        cid: { type: string }
        auth:
          $ref: "#/components/schemas/Auth"
        appLevelCustomVariables:
          type: array
          description: Global key→value pairs shared across every suite. Reference in step bodies/urls/headers/asserts as `{{key}}`. Patch one variable at a time via updateApp.app_level_custom_variables (singular ExtractInput with Action add/update/delete).
          items:
            type: object
            properties:
              key: { type: string }
              value: { type: string }
        ignoreEndpoints:
          type: array
          items: { type: string }
        timeout: { type: integer, description: "Per-request timeout in seconds (0 = use default 30)" }
        rateLimit: { type: integer, description: "Max requests/sec the runner will fire (0 = unlimited)" }
        disableSchemaAssertion: { type: boolean }
        webhookUrl: { type: string }
        created_at: { type: integer, format: int64 }
        updated_at: { type: integer, format: int64 }

    Origin:
      type: object
      properties:
        type: { type: string }
        clusterId: { type: string }
        namespace: { type: string }
        deployment: { type: string }
        clusterName: { type: string }

    AppWithRecordingsResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        origin:
          $ref: "#/components/schemas/Origin"

    TestSetResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        app_id: { type: string }
        namespace: { type: string }
        deployment: { type: string }
        image_name: { type: string }
        image_tag: { type: string }
        testcase_count: { type: integer }
        created_at: { type: integer }

    HTTPRequest:
      type: object
      properties:
        method: { type: string }
        url: { type: string }
        header: { type: object, additionalProperties: { type: string } }
        body: { type: string }

    HTTPResponse:
      type: object
      properties:
        status_code: { type: integer }
        header: { type: object, additionalProperties: { type: string } }
        body: { type: string }

    TestCaseResponse:
      type: object
      properties:
        id: { type: string }
        test_set_id: { type: string }
        name: { type: string }
        namespace: { type: string }
        deployment: { type: string }
        failed: { type: boolean }
        http_req:
          $ref: "#/components/schemas/HTTPRequest"
        http_resp:
          $ref: "#/components/schemas/HTTPResponse"

    GeneratedSchemaResponse:
      type: object
      properties:
        app_id: { type: string }
        schema: { type: string, description: "Auto-generated OpenAPI schema from recorded traffic" }

    ClusterResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        deployment_type: { type: string, enum: [saas, self-hosted] }

    CreateClusterRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Cluster name. Must be unique within the company.
        deployment_type:
          type: string
          enum: [saas, self-hosted]
          default: self-hosted
          description: Defaults to self-hosted when omitted.

    ClusterCreatedResponse:
      type: object
      properties:
        cluster_id: { type: string }
        access_key:
          type: string
          description: Cluster access key. Returned only once at creation — store it securely.
        name: { type: string }
        deployment_type: { type: string, enum: [saas, self-hosted] }

    AppByClusterResponse:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        origin:
          $ref: "#/components/schemas/Origin"

    TestRunReportResponse:
      type: object
      description: |
        Rollup view of a single legacy /tr test run. For AI analysis prefer
        `getTestReportFull` — this shape gives counts + CI/normalize/coverage
        metadata but doesn't include per-test diffs or mock_mismatches.
      properties:
        id: { type: string }
        app_id: { type: string }
        name: { type: string }
        test_set_count: { type: integer }
        passed_count: { type: integer }
        failed_count: { type: integer }
        ignored_count: { type: integer }
        tot_passed_tc: { type: integer }
        tot_failed_tc: { type: integer }
        tot_ignored_tc: { type: integer }
        status:
          type: string
          # Mirrors OSS keploy v3.5.49 TestStatus enum (six values).
          # Writers today emit PASSED/FAILED/RUNNING/PENDING at the
          # run level but IGNORED/OBSOLETE may surface from older
          # reports or future replayer behaviour, so the wire enum
          # tracks the full upstream set.
          enum: [PASSED, FAILED, RUNNING, PENDING, IGNORED, OBSOLETE]
        created_at: { type: integer }
        normalised_tc_passed_count: { type: integer }
        normalised_tc_failed_count: { type: integer }
        deleted_tc_passed_count: { type: integer }
        deleted_tc_failed_count: { type: integer }
        ignored_tc_passed_count: { type: integer }
        ignored_tc_failed_count: { type: integer }
        normalised_ts_passed_count: { type: integer }
        normalised_ts_failed_count: { type: integer }
        deleted_ts_passed_count: { type: integer }
        deleted_ts_failed_count: { type: integer }
        ignored_ts_passed_count: { type: integer }
        ignored_ts_failed_count: { type: integer }
        created_by: { $ref: "#/components/schemas/CreatorDetails" }
        normalize_data: { $ref: "#/components/schemas/NormalizeData" }
        coverage: { $ref: "#/components/schemas/TestCoverage" }
        schema_coverage: { type: number, nullable: true }
        enable_download: { type: boolean }
        ci_metadata: { $ref: "#/components/schemas/CIMetadata" }
        branch_id: { type: string }

    TestSetReportResponse:
      type: object
      description: |
        Per-test-set roll-up. Includes `tests[]` (per-case name + status +
        status_code) so callers can identify failing cases without fanning
        out to `listTestCaseReports`.
      properties:
        id: { type: string }
        test_set_id: { type: string }
        test_run_id: { type: string }
        name: { type: string }
        test_set_name: { type: string }
        status: { type: string }
        success: { type: integer }
        failure: { type: integer }
        obsolete: { type: integer }
        ignored: { type: integer }
        total: { type: integer }
        created_at: { type: integer }
        tests:
          type: array
          items: { $ref: "#/components/schemas/TestCaseInfo" }
        normalize_data: { $ref: "#/components/schemas/NormalizeData" }

    TestCaseReportResponse:
      type: object
      description: |
        Individual test-case result. `oss_report.result` carries the
        structured request/response/body/header diff;
        `oss_report.mock_mismatches` carries the expected-vs-actual mock
        list the replayer observed (populated for pass + fail cases when
        consumed-mock data is known — used to investigate mock drift).
      properties:
        test_set_report_id: { type: string }
        test_case_name: { type: string }
        test_case_id: { type: string }
        status: { type: string }
        oss_report: { $ref: "#/components/schemas/OssTestResult" }
        created_at: { type: integer }

    CreatorDetails:
      type: object
      properties:
        email: { type: string }
        userId: { type: string }
        cid: { type: string }

    NormalizeData:
      type: object
      properties:
        isNormalized: { type: boolean }
        editedBy: { type: string }
        editedAt: { type: string, format: date-time }

    TestCoverage:
      type: object
      properties:
        fileCoverage:
          type: object
          additionalProperties: { type: string }
        totalCoverage: { type: string }
        loc:
          type: object
          properties:
            total: { type: integer }
            covered: { type: integer }

    CIMetadata:
      type: object
      description: CI provenance stamped by the enterprise CLI when running in a pipeline.
      properties:
        provider:
          type: string
          description: e.g. github_actions, gitlab_ci, circleci, jenkins.
        branch: { type: string }
        commit_sha: { type: string }
        pipeline_url: { type: string }
        repository: { type: string }
        repo_url: { type: string }
        pr_number: { type: integer }
        pr_source_branch: { type: string }
        pr_target_branch: { type: string }
        trigger_actor: { type: string }
        trigger_actor_avatar: { type: string }
        build_id: { type: string }

    TestCaseInfo:
      type: object
      description: |
        Mirrors models.TestCaseInfo (pkg/models/testSetReport.go). Field
        names match the JSON tags on the Go struct exactly — `testName`
        (camelCase) for the case name, `status_code` (snake_case via
        the `json:"status_code"` tag on StatusCode) for the response
        status, `status` (lowercase string) for PASSED/FAILED/etc.
      properties:
        testName: { type: string }
        status:
          type: string
          description: PASSED / FAILED / OBSOLETE / IGNORED.
        status_code: { type: integer }

    MockEntry:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }

    OssTestResult:
      type: object
      description: |
        Wire shape of `go.keploy.io/server/v3@v3.5.49 models.TestResult`.
        Property names track the JSON tags on the Go struct exactly — note
        that several are camelCase (`testCasePath`, `mockPath`,
        `testCaseID`) even though the surrounding API surface mostly
        uses snake_case. The yaml tags on the same struct are snake_case
        but encoding/json reads json tags, not yaml.
      properties:
        kind:
          type: string
          # OSS keploy v3.5.49 Kind enum — HTTP / Mongo / Generic / SQL /
          # Postgres / GRPC / Redis. Always emitted (no omitempty on the
          # OSS json tag).
          description: Protocol family of the test interaction.
        name: { type: string }
        status: { type: string }
        started: { type: integer }
        completed: { type: integer }
        time_taken:
          type: string
          # Always emitted on the wire (no omitempty upstream); typically
          # a duration string like "1.2s" stamped by the replayer.
          description: Wall-clock duration of the test case as a Go duration string.
        testCasePath: { type: string }
        mockPath: { type: string }
        testCaseID: { type: string }
        req: { $ref: "#/components/schemas/HTTPReq" }
        resp: { $ref: "#/components/schemas/HTTPResp" }
        # gRPC request/response — omitempty upstream, so populated only
        # for grpc-protocol test cases. Schemas are open `object` since
        # the OSS GrpcReq / GrpcResp structs are deep and rarely
        # consumed by AI/MCP analysis; callers that need them should
        # treat the payload as opaque.
        grpcReq:
          type: object
          additionalProperties: true
          nullable: true
        grpcRes:
          type: object
          additionalProperties: true
          nullable: true
        result: { $ref: "#/components/schemas/OssResult" }
        noise:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        mock_mismatches: { $ref: "#/components/schemas/MockMismatchInfo" }
        failure_info: { $ref: "#/components/schemas/OssFailureInfo" }

    OssFailureInfo:
      type: object
      description: |
        Wire shape of `go.keploy.io/server/v3@v3.5.49 models.FailureInfo`.
        Populated by the matcher (`risk`, `category`, `assessment`) and
        the replayer (`matched_calls`, `unmatched_calls`, `mock_mismatch`).
        All fields are `omitempty` upstream — a passing test case may
        emit `{}`, a failing case typically emits at least `risk` and
        `category`.
      properties:
        risk:
          type: string
          description: OSS RiskLevel enum (e.g. low / medium / high / critical).
        category:
          type: array
          items:
            type: string
            description: OSS FailureCategory enum entries (e.g. body_mismatch, header_mismatch).
        assessment:
          type: object
          additionalProperties: true
          nullable: true
          description: OSS FailureAssessment — open object; consume as opaque.
        mock_mismatch: { $ref: "#/components/schemas/MockMismatchInfo" }
        matched_calls:
          type: array
          items:
            type: object
            additionalProperties: true
          description: OSS MatchedCall entries — open object; consume as opaque.
        unmatched_calls:
          type: array
          items:
            type: object
            additionalProperties: true
          description: OSS UnmatchedCall entries — open object; consume as opaque.

    MockMismatchInfo:
      type: object
      properties:
        expected_mocks:
          type: array
          items: { $ref: "#/components/schemas/MockEntry" }
        actual_mocks:
          type: array
          items: { $ref: "#/components/schemas/MockEntry" }

    OssResult:
      type: object
      properties:
        status_code: { $ref: "#/components/schemas/IntResult" }
        headers_result:
          type: array
          items: { $ref: "#/components/schemas/HeaderResult" }
        body_result:
          type: array
          items: { $ref: "#/components/schemas/BodyResult" }
        trailer_result:
          type: array
          items: { $ref: "#/components/schemas/HeaderResult" }
        body_size_result: { $ref: "#/components/schemas/IntResult" }
        dep_result:
          type: array
          items: { type: object }

    IntResult:
      type: object
      properties:
        normal: { type: boolean }
        expected: { type: integer }
        actual: { type: integer }

    HeaderResult:
      type: object
      properties:
        normal: { type: boolean }
        expected:
          type: object
          properties:
            key: { type: string }
            value:
              type: array
              items: { type: string }
        actual:
          type: object
          properties:
            key: { type: string }
            value:
              type: array
              items: { type: string }

    BodyResult:
      type: object
      properties:
        normal: { type: boolean }
        type: { type: string }
        expected: { type: string }
        actual: { type: string }

    HTTPReq:
      type: object
      description: |
        Wire shape of `go.keploy.io/server/v3@v3.5.49 models.HTTPReq`.
        `header` is a `map[string]string` (single value per key), not a
        list. There is no `host` / `port` / `body_type` on this struct —
        host/port live on the enclosing TestCase/Spec, body framing is
        implicit in `body`.
      properties:
        method: { type: string }
        proto_major: { type: integer }
        proto_minor: { type: integer }
        url: { type: string }
        url_params:
          type: object
          additionalProperties: { type: string }
        header:
          type: object
          additionalProperties: { type: string }
        body: { type: string }
        body_ref:
          type: object
          description: Set when body was offloaded to asset storage (>1MB).
        binary: { type: string }
        form:
          type: array
          items: { type: object }
        timestamp: { type: string, format: date-time }

    HTTPResp:
      type: object
      description: |
        Wire shape of `go.keploy.io/server/v3@v3.5.49 models.HTTPResp`.
        `header` is a `map[string]string` (single value per key). No
        `body_type` on this struct.
      properties:
        status_code: { type: integer }
        header:
          type: object
          additionalProperties: { type: string }
        body: { type: string }
        body_skipped: { type: boolean }
        body_size: { type: integer, format: int64 }
        status_message: { type: string }
        proto_major: { type: integer }
        proto_minor: { type: integer }
        binary: { type: string }
        timestamp: { type: string, format: date-time }

    MockReferenceResponse:
      type: object
      properties:
        test_set_id: { type: string }
        namespace: { type: string }
        deployment: { type: string }
        storage_type: { type: string }
        mock_count: { type: integer }
        created_at: { type: integer, format: int64 }

    MockSpecResponse:
      type: object
      properties:
        name: { type: string }
        kind: { type: string }
        spec: { type: string, description: "Raw YAML of this mock document" }

    SubscriptionResponse:
      type: object
      properties:
        id: { type: string }
        plan_type: { type: string }
        plan_status: { type: string }
        product_type: { type: string }
        expiration: { type: integer, format: int64 }
        created_at: { type: integer, format: int64 }

    PublicAPIKey:
      type: object
      properties:
        id: { type: string }
        key_prefix: { type: string }
        name: { type: string }
        scopes: { type: array, items: { type: string } }
        cid: { type: string }
        created_by: { type: string }
        created_at: { type: integer, format: int64 }
        last_used_at: { type: integer, format: int64 }
        expires_at: { type: integer, format: int64, nullable: true }
        status: { type: string, enum: [active, revoked] }

    # ── Request bodies ────────────────────────────────────────────────
    CreateAppRequest:
      type: object
      required: [name]
      description: |
        Body for POST /apps. Name is required and immutable — pick it
        carefully because updateApp deliberately rejects renames (the
        app name is the stable identifier devs and CI scripts type
        into commands; renaming would silently break references).
        Auth and the runtime-config fields can be set at creation so
        you don't have to follow up with an updateApp.
      properties:
        name:
          type: string
          description: App name. IMMUTABLE — cannot be changed via updateApp.
        endpoint: { type: string }
        schema:
          type: string
          description: OpenAPI/Swagger doc the validators use to suggest test cases.
        docs:
          type: string
          description: Free-form developer docs the AI uses as additional context.
        api_examples:
          type: string
          description: Sample request/response pairs the AI consults when authoring suites.
        webhook_url:
          type: string
          description: Optional webhook URL invoked at run lifecycle events.
        max_test_suites:
          type: integer
          description: Cap on how many suites generate-tests will mint at once. Server default applies if omitted.
        disable_schema_assertion: { type: boolean }
        auth:
          $ref: "#/components/schemas/Auth"
          description: |
            Authentication config the runner injects on every step
            request. Validation matches the GraphQL CreateApp resolver
            (and atg.Test's runtime check) — set authtype="None" for
            no auth, or supply the type-specific fields (BasicAuth
            needs Username+Password, BearerToken needs Token, etc.).

    UpdateAppRequest:
      type: object
      description: |
        RENAMING APPS IS PROHIBITED. The app name is the immutable
        identifier devs and CI scripts type into commands; the API
        rejects every attempt to change it. Do not try to work around
        this with raw curl, GraphQL, or any other path — they all
        fail. If a different name is required, create a new app and
        migrate the test suites manually.

        Other than that: PATCH-style update — only the fields you set
        get written. Use this to fix app-level config when a test
        suite run fails on a recoverable misconfiguration:
        wrong/expired bearer token (auth), missing global variable
        (app_level_custom_variables), wrong rate limit, etc. After
        updating, re-run `keploy create-test-suite` (or call
        create_test_suite again); the CLI re-fetches the app each
        invocation so it picks up the patched config without any extra
        plumbing.

        Concrete behavior on rename attempts: `name` is not part of
        this request schema, so a top-level `name` field is rejected
        during JSON decoding (unknown fields are disallowed) before
        any other validation runs. The same prohibition is enforced
        independently in the validation layer for non-HTTP callers.
      properties:
        endpoint: { type: string }
        schema: { type: string }
        docs: { type: string, description: "Free-form developer docs. Used by AI as additional context when authoring suites." }
        api_examples: { type: string, description: "Sample request/response pairs the AI consults when authoring suites." }
        brd: { type: string, description: "Business requirements document content the AI uses for context." }
        prd: { type: string, description: "Product requirements document content the AI uses for context." }
        postman: { type: string, description: "Postman collection JSON the AI parses for endpoint shapes / examples." }
        code_snippet: { type: string, description: "Server code snippet the AI uses for endpoint context." }
        main_curl: { type: string, description: "Reference curl that drives generation when no schema is available." }
        graphql_schema: { type: string, description: "GraphQL schema (SDL) the AI uses when generating GraphQL suites." }
        country: { type: string, description: "Two-letter country code controlling data-residency-affected behavior. Rarely set." }
        webhook_url: { type: string }
        auth:
          $ref: "#/components/schemas/Auth"
          description: Replaces the app's full auth config. To clear auth, set { authtype "None" }.
        app_level_custom_variables:
          type: object
          description: Add / update / delete a SINGLE global variable. The Action enum on the embedded ExtractInput controls the operation. To set multiple variables, call updateApp once per variable.
          properties:
            key: { type: string }
            value: { type: string }
            type: { type: string }
            level: { type: string }
            action: { type: string, enum: [add, update, delete] }
        app_level_custom_function:
          type: object
          description: Register a JS function devs can reference from suite step templates. Key uniquely identifies the function; CustomFunction is the JS source.
          properties:
            Key: { type: string }
            CustomFunction: { type: string }
        labels:
          type: array
          description: |
            Add or update labels on the app. New labels (no `id`)
            require both `name` and `color`; updates to existing
            labels (with `id`) require at least one of `name`/`color`.
          items:
            type: object
            properties:
              id: { type: string, description: "Existing label ID. Omit to add a new label." }
              name: { type: string }
              color: { type: string }
        ignore_endpoints:
          type: array
          description: Endpoint patterns the runner skips when generating / running suites.
          items: { type: string }
        max_test_suites: { type: integer, description: "Cap on how many suites generate-tests will mint at once. Server default applies if omitted." }
        rate_limit: { type: integer, description: "Requests-per-second cap the runner applies to outbound calls during runs." }
        enable_pre_hook: { type: boolean, description: "Run the pre-step hook before each test step." }
        enable_post_hook: { type: boolean, description: "Run the post-step hook after each test step." }
        private_mode: { type: boolean, description: "Restrict app visibility to the authenticated user only." }
        disable_schema_assertion: { type: boolean }

    Auth:
      type: object
      description: Authentication configuration for test execution. The runner injects the matching headers on every step request.
      properties:
        AuthType: { type: string, enum: [BearerToken, BasicAuth, APIKeyAuth, CookieAuth, LoginCurl, None] }
        BearerToken: { type: object, properties: { Token: { type: string } } }
        BasicAuth: { type: object, properties: { Username: { type: string }, Password: { type: string } } }
        APIKeyAuth: { type: object, properties: { Key: { type: string }, Value: { type: string } } }
        Cookie: { type: object, properties: { Cookie: { type: string } } }
        LoginCurl:
          type: object
          properties:
            Curl: { type: string, description: "Raw curl command that performs the login. Runner executes once at session start and parses the response." }
            CurlResponseType: { type: string, description: "How to interpret the response (jwt | cookie)." }
            JwtPath: { type: string, description: "JSONPath into the response that yields the bearer token." }

    GenerateTestSuitesRequest:
      type: object
      required: [base_url]
      properties:
        base_url: { type: string }
        schema: { type: string, description: "OpenAPI spec (YAML or JSON)" }
        docs: { type: string, description: "API documentation text" }
        examples: { type: string, description: "Example curls or request/response pairs" }
        user_prompt: { type: string, description: "Additional instructions for AI generation" }
        code_snippet: { type: string, description: "Relevant source code for context" }
        auth: { $ref: "#/components/schemas/Auth" }
        max_test_suites: { type: integer, default: 30 }
        ignore_endpoints: { type: array, items: { type: string } }
        webhook_url: { type: string }
        rate_limit: { type: integer }
        timeout: { type: integer }

    CreateAPIKeyRequest:
      type: object
      required: [name, scopes]
      properties:
        name: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [read, write, admin] }
        ttl_days: { type: integer }

    # ── Typed envelopes ───────────────────────────────────────────────
    EnvelopeApp:
      type: object
      properties:
