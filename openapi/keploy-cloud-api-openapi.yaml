    EnvelopeError:
      type: object
      properties:
        error:
          $ref: "#/components/schemas/APIError"
        meta:
          $ref: "#/components/schemas/Meta"

    ValidatorRule:
      type: object
      description: |
        A single MCP-validator rule. Returned inside
        ValidatorVersionMismatch.changed_rules so clients can render
        the specific rules that were added between their pre-validation
        binary and this api-server.
      properties:
        ID:
          type: string
          description: Stable rule identifier (e.g. R1, R29).
        AddedIn:
          type: string
          description: Rule-set version in which this rule was first introduced (e.g. v1).
        Summary:
          type: string
          description: Human-readable description of what the rule enforces.
        EscapeHatch:
          type: string
          description: |
            Per-rule escape-hatch flag the suite author can set to opt
            out of the rule (e.g. `allow_get_body`). Empty string when
            the rule has no escape hatch.

    ValidatorVersionMismatch:
      type: object
      description: |
        Body of the HTTP 426 response when an enterprise binary
        pre-validates a suite locally and stamps a
        `X-Keploy-Validator-Version` header whose value disagrees with
        the rule set this api-server expects. Returned wrapped in the
        standard Envelope under `data` (see EnvelopeValidatorVersion
        Mismatch); fields are surfaced individually so clients can
        render an upgrade prompt directly without re-parsing.
      properties:
        error:
          type: string
          description: Stable error key (currently always `validator_version_mismatch`).
        client_sent:
          type: string
          description: The version string the client supplied via the header.
        server_expected:
          type: string
          description: The rule-set version this api-server is built against.
        message:
          type: string
          description: Human-readable upgrade instruction for display in CLI/UI.
        changed_rules:
          type: array
          description: |
            Rules added between the client's version and the server's
            version, when known. Each entry is a full ValidatorRule
            object (id + summary + optional escape-hatch flag) so
            clients can render an explanation for each rule the user's
            binary doesn't yet know about.
          items:
            $ref: "#/components/schemas/ValidatorRule"

    EnvelopeValidatorVersionMismatch:
      type: object
      description: |
        Standard envelope wrapping a ValidatorVersionMismatch payload
        under `data`. This is the actual on-the-wire shape of the 426
        response — every other apiv1 response goes through the same
        writeJSON helper that adds `data`/`meta`, so 426 follows suit
        for consistency with the rest of the surface.
      properties:
        data:
          $ref: "#/components/schemas/ValidatorVersionMismatch"
        meta:
          $ref: "#/components/schemas/Meta"

    RunTestSuitesRequest:
      type: object
      description: |
        Body for POST /apps/{appId}/test-suites/run. Mirrors
        apiv1.RunTestSuitesRequest in test_suites.go — the spec
        documents only the fields the SaaS path uses; nested
        polymorphic fields (auth) carry their type via authtype and
        are intentionally modelled as open objects here because the
        BasicAuth/BearerToken/APIKeyAuth/CookieAuth/LoginCurl variant
        shapes don't fit cleanly into OpenAPI 3.0.3 oneOf without
        adding a discriminator wrapper that doesn't match the
        on-the-wire shape.
      required: [base_url]
      properties:
        base_url:
          type: string
          description: |
            PUBLIC target URL the SaaS backend will hit. Loopback /
            private IPs are rejected with 400. For localhost runs use
            the MCP record_sandbox_test tool, not this endpoint.
        test_suite_ids:
          type: array
          description: |
            Suite IDs to include in the run. Empty/omitted means "run
            all suites for the app" — same default the GraphQL surface
            applies.
          items:
            type: string
        auth:
          type: object
          description: |
            Optional auth bundle the runner injects into every step.
            Carries an `authtype` discriminator (BearerToken /
            BasicAuth / APIKeyAuth / CookieAuth / LoginCurl / None)
            plus the matching variant block. See models.Auth in
            pkg/models/e2e.go for the full shape.
        rate_limit:
          type: integer
          description: Per-second cap on outgoing requests; 0 means unbounded.
        timeout:
          type: integer
          description: Per-request timeout in seconds; 0 means use the runner default.
        sandbox_mode:
          type: string
          description: |
            Empty for normal in-backend runs. `rerecord` and
            `integration_test` switch to sandbox flow where the local
            keploy agent or k8s-proxy drives the run. Surfaced for
            completeness; MCP tools (record_sandbox_test /
            replay_sandbox_test) are the supported entry points.
          enum: ["", "rerecord", "integration_test"]

  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    Forbidden:
      description: "Insufficient scope or role (error code: INSUFFICIENT_SCOPE)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    Conflict:
      description: "Resource conflict (e.g., duplicate name)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    PayloadTooLarge:
      description: |
        Request body exceeded the 5 MB cap enforced by the validation
        middleware (and decodeJSONBody as defence-in-depth). Returned
        for any body-accepting operation when the wrapped reader trips
        MaxBytesReader. The body is the standard error envelope with
        code `VALIDATION_ERROR`.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeError"
    UpgradeRequired:
      description: |
        Validator-version mismatch — the client's enterprise binary
        validates against an older or newer rule set than this
        api-server expects. The body names the expected version and
        (when known) the rules added between them so the user can
        decide whether to upgrade the binary or roll back the server.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/EnvelopeValidatorVersionMismatch"
