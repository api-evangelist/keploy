    post:
      operationId: createCIBranch
      x-required-scope: write
      summary: Find-or-create a CI branch
      description: "Creates a new Keploy branch (or returns the existing one) for a CI pipeline run. Idempotent on the (appId, name) pair. Requires scope: `write`."
      tags: [Branches]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "Branch name (e.g., `pr-123`)" }
                git_ref:
                  type: object
                  description: "Optional Git provider context (PR, repo, etc.)"
                  properties:
                    provider: { type: string }
                    repo_full_name: { type: string }
                    pr_number: { type: integer }
                    source_branch: { type: string }
                    target_branch: { type: string }
                    installation_id: { type: integer, format: int64 }
