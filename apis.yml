- name: Keploy Cloud API
  description: REST API for Keploy Cloud (base https://api.keploy.io/client/v1) providing AI test-suite generation
    and execution, app/test-suite management, recordings/mocks, test and load-test reports, schema coverage, smart
    sets, branches, jobs, API keys, clusters, and account/subscription info. Authenticated via scoped kep_-prefixed
    API keys (X-API-Key or Bearer). A first-party OpenAPI 3.0.3 (55 paths, 71 operations) is served at https://api.keploy.io/client/v1/openapi.yaml.
