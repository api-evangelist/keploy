- name: Keploy MCP Server
  description: 'Hosted, remote Model Context Protocol server (streamable HTTP, bearer kep_ PAT auth) at https://api.keploy.io/client/v1/mcp.
    Probed live 2026-09-03: anonymous tools/list returns 7 gateway tools (search_tools / get_tool_schema / invoke_tool
    progressive disclosure) over a 112-tool catalog that proxies the Cloud REST API 1:1 by operationId plus composite
    devloop_* agent workflows. Serves clients like Cursor, GitHub Copilot, Claude Code, and Windsurf; the former
    docs page keploy.io/docs/keploy-cloud/mcp now 404s and setup instructions are served by the server itself.'
  humanURL: https://keploy.io/docs/running-keploy/public-api/
