image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/keploy.png
name: Keploy
description: Open-source, AI-native testing platform that captures real production API traffic with eBPF and replays
  it in CI as deterministic tests, auto-generated mocks, and production-like sandboxes with zero code changes. Publishes
  a first-party OpenAPI 3.0.3 for its Cloud REST API, a hosted MCP server with a 112-tool catalog, llms.txt, and
  a Kubernetes Proxy REST API for in-cluster recording and replay.
url: https://raw.githubusercontent.com/api-evangelist/keploy/refs/heads/main/apis.yml
created: '2026-07-03'
modified: '2026-09-03'
specificationVersion: '0.23'
tags:
- Testing & QA
- API Testing
- Integration/Regression Testing
- Unit Test Generation
- Contract Testing
- CI/CD
- Developer Tools
- AI / Agent Tooling
- eBPF / Observability
- Test Data & Mocking
apis:
- name: Keploy MCP Server
  description: >-
    Hosted, remote Model Context Protocol server (streamable HTTP, bearer kep_ PAT auth) at https://api.keploy.io/client/v1/mcp.
    Probed live 2026-09-03: anonymous tools/list returns 7 gateway tools (search_tools / get_tool_schema
    / invoke_tool progressive disclosure) over a 112-tool catalog that proxies the Cloud REST API 1:1
    by operationId plus composite devloop_* agent workflows. Serves clients like Cursor, GitHub Copilot,
    Claude Code, and Windsurf; the former docs page keploy.io/docs/keploy-cloud/mcp now 404s and setup
    instructions are served by the server itself.
  humanURL: https://keploy.io/docs/running-keploy/public-api/
  baseURL: https://api.keploy.io/client/v1/mcp
  tags:
  - Testing & QA
  - API Testing
  - Integration/Regression Testing
  - Unit Test Generation
  - Contract Testing
  - CI/CD
  - Developer Tools
  - AI / Agent Tooling
  - eBPF / Observability
  - Test Data & Mocking
  properties:
  - type: MCPServer
    url: https://api.keploy.io/client/v1/mcp
  - type: MCPServer
    url: mcp/keploy-mcp.yml
  - type: ToolCrosswalk
    url: mcp/keploy-tool-crosswalk.yml
  - type: LLMSTxt
    url: https://keploy.io/llms.txt
  - type: LLMSTxt
    url: https://keploy.io/llms-full.txt
  - type: Documentation
    url: https://keploy.io/docs/running-keploy/public-api/
- name: Keploy Kubernetes Proxy REST API
  description: >-
    Self-hosted REST API of the Keploy Kubernetes Proxy, an in-cluster control plane (Helm chart k8s-proxy)
    that drives eBPF/sidecar recording, auto-replay, deduplication, schema generation, and reports for
    Deployments. Operational routes (/record/start, /record/stop, /test/start, /deployments, /proxy/update,
    streaming status) plus API-server-compatible /k8s-proxy/* data routes. Runs at the customer-configured
    ingress URL and authenticates with a shared bearer token (K8S_PROXY_SHARED_TOKEN); templated base
    URL, no public callable host.
  humanURL: https://keploy.io/docs/running-keploy/k8s-proxy-api/
  baseURL: https://{your-proxy-ingress}
  tags:
  - Testing & QA
  - Kubernetes
  - eBPF / Observability
  - CI/CD
  - Enterprise
  properties:
  - type: Documentation
    url: https://keploy.io/docs/running-keploy/k8s-proxy-api/
