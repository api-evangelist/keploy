- name: Keploy Kubernetes Proxy REST API
  description: Self-hosted REST API of the Keploy Kubernetes Proxy, an in-cluster control plane (Helm chart k8s-proxy)
    that drives eBPF/sidecar recording, auto-replay, deduplication, schema generation, and reports for Deployments.
    Operational routes (/record/start, /record/stop, /test/start, /deployments, /proxy/update, streaming status)
    plus API-server-compatible /k8s-proxy/* data routes. Runs at the customer-configured ingress URL and authenticates
    with a shared bearer token (K8S_PROXY_SHARED_TOKEN); templated base URL, no public callable host.
  humanURL: https://keploy.io/docs/running-keploy/k8s-proxy-api/
  baseURL: https://{your-proxy-ingress}
